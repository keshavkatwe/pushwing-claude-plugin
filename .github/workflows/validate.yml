name: Validate plugin
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --global @anthropic-ai/claude-code@2.1.322
      - run: claude plugin validate . --strict
      - name: Validate skill metadata
        run: |
          python3 -m pip install 'PyYAML>=6,<7'
          python3 - <<'PYTHON'
          from pathlib import Path
          import yaml
          skills = {'setup', 'publish', 'schedule', 'status', 'report', 'brand-setup', 'new-post', 'continue-post', 'review-post'}
          root = Path('skills')
          assert {p.name for p in root.iterdir() if p.is_dir()} == skills
          for name in skills:
              path = root / name / 'SKILL.md'
              text = path.read_text()
              assert text.startswith('---\n') and len(text.encode()) <= 1024 * 1024
              header, body = text[4:].split('\n---\n', 1)
              data = yaml.safe_load(header)
              assert data['name'] == name and isinstance(data['description'], str) and data['description'].strip()
              assert body.strip()
          print('Validated nine skill entry points')
          PYTHON
      - name: Check incomplete discovery detection
        run: python3 -m unittest discover -s tests -v
      - name: Check native marketplace tool discovery
        run: python3 scripts/smoke_discovery.py --host claude
